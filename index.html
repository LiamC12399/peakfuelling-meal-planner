<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full 90 Formula | Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --wa-bg:#0b141a;--wa-header:#1a1a2e;--wa-input-bg:#2a3942;
  --wa-out:#1a1a2e;--wa-in:#16213e;--wa-text:#e9edef;--wa-muted:#8696a0;
  --wa-divider:rgba(240,235,224,.1);
  --gold:#c9a84c;--gold-dim:rgba(201,168,76,.15);--gold-muted:rgba(201,168,76,.55);
  --cream:#f0ebe0;--line:rgba(240,235,224,.12);
  --bg-hero:#152a1e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--wa-bg);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;height:100dvh;overflow:hidden;}

/* ACCESS GATE */
#gate{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#0b141a 0%,#1a1a2e 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem;text-align:center;z-index:100;
}
.gate-logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:.12em;color:var(--cream);margin-bottom:4px;}
.gate-sub{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:2.5rem;}
.gate-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.8rem,6vw,2.8rem);letter-spacing:.06em;color:var(--cream);line-height:1;margin-bottom:.8rem;}
.gate-desc{font-size:.85rem;color:var(--wa-muted);margin-bottom:2rem;max-width:320px;line-height:1.6;}
.gate-input{
  width:100%;max-width:300px;
  background:rgba(240,235,224,.06);
  border:1px solid var(--gold-muted);
  color:var(--cream);
  font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
  padding:.9rem 1.2rem;text-align:center;outline:none;border-radius:2px;
  transition:border-color .2s;margin-bottom:.8rem;
}
.gate-input::placeholder{color:var(--wa-muted);letter-spacing:.15em;font-size:.85rem;text-transform:none;}
.gate-input:focus{border-color:var(--gold);}
.gate-input.err{border-color:#e74c3c;animation:shake .3s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gate-btn{
  width:100%;max-width:300px;
  font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.22em;
  color:#0b141a;background:var(--gold);
  border:none;padding:1rem;cursor:pointer;border-radius:2px;
  transition:opacity .2s;
}
.gate-btn:hover{opacity:.88;}
.gate-error{font-size:.8rem;color:#e74c3c;margin-top:.5rem;min-height:1.2rem;}
.gate-note{font-family:'Barlow Condensed',sans-serif;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--wa-muted);margin-top:1.5rem;opacity:.6;}

/* MAIN APP */
#app{display:flex;flex-direction:column;height:100dvh;}

/* Header */
.wa-header{
  background:var(--wa-header);
  padding:10px 16px;
  display:flex;align-items:center;gap:12px;
  flex-shrink:0;
  border-bottom:1px solid var(--wa-divider);
}
.wa-avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),#8b6914);
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:16px;
  color:#0b141a;flex-shrink:0;letter-spacing:.04em;
}
.wa-info{flex:1;}
.wa-name{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;color:var(--cream);line-height:1.2;}
.wa-badge{
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;
  color:#0b141a;background:var(--gold);
  padding:2px 7px;border-radius:2px;display:inline-block;margin-top:2px;
}
.wa-status{font-size:11px;color:var(--gold-muted);margin-top:3px;display:flex;align-items:center;gap:4px;}
.wa-online-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;}

/* Chat */
.wa-chat{
  flex:1;overflow-y:auto;
  padding:12px 16px 8px;
  display:flex;flex-direction:column;gap:2px;
  background-color:var(--wa-bg);
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23182229' fill-opacity='0.3'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.wa-chat::-webkit-scrollbar{width:3px;}
.wa-chat::-webkit-scrollbar-thumb{background:rgba(201,168,76,.2);border-radius:2px;}

.wa-date-div{text-align:center;margin:8px 0;}
.wa-date-div span{font-size:12px;color:var(--wa-muted);background:rgba(11,20,26,.85);padding:4px 10px;border-radius:8px;display:inline-block;}

/* Messages */
.wa-row{display:flex;margin-bottom:2px;}
.wa-row.out{justify-content:flex-end;}
.wa-row.in{justify-content:flex-start;}
.wa-row.out+.wa-row.in,.wa-row.in+.wa-row.out{margin-top:6px;}

.wa-bub{
  max-width:72%;padding:8px 12px 6px;
  font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.55;
  color:var(--wa-text);position:relative;word-wrap:break-word;
  animation:waIn .15s ease forwards;
}
@keyframes waIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.wa-row.out .wa-bub{background:var(--wa-out);border-radius:8px 8px 2px 8px;border:1px solid rgba(201,168,76,.15);}
.wa-row.in .wa-bub{background:var(--wa-in);border-radius:8px 8px 8px 2px;border:1px solid rgba(240,235,224,.06);}
.wa-row.out .wa-bub::after{content:'';position:absolute;bottom:0;right:-8px;width:0;height:0;border-style:solid;border-width:0 0 10px 10px;border-color:transparent transparent var(--wa-out) transparent;}
.wa-row.in .wa-bub::after{content:'';position:absolute;bottom:0;left:-8px;width:0;height:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent var(--wa-in) transparent transparent;}

.wa-bub p{margin-bottom:6px;}
.wa-bub p:last-child{margin-bottom:0;}
.wa-bub .mh{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.08em;color:var(--gold);margin:14px 0 4px;padding-bottom:4px;border-bottom:1px solid rgba(201,168,76,.2);}
.wa-bub .mh:first-child{margin-top:0;}
.wa-bub strong{font-weight:600;color:var(--cream);}
.wa-bub ul,.wa-bub ol{padding-left:18px;margin-bottom:6px;}
.wa-bub li{margin-bottom:3px;line-height:1.5;}
.wa-bub .pf-tag{margin-top:10px;padding-top:8px;border-top:1px solid rgba(201,168,76,.15);font-size:11px;color:var(--gold-muted);font-style:italic;}

.wa-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:3px;}
.wa-time{font-size:11px;color:rgba(134,150,160,.7);}
.wa-tick{color:var(--gold);font-size:12px;}

/* Typing */
.wa-typing-row{display:flex;justify-content:flex-start;margin-bottom:4px;}
.wa-typing-bub{background:var(--wa-in);padding:12px 16px;border-radius:8px 8px 8px 2px;border:1px solid rgba(240,235,224,.06);display:flex;gap:4px;align-items:center;}
.wa-typing-bub span{width:7px;height:7px;border-radius:50%;background:var(--gold-muted);animation:waDot 1.3s infinite;}
.wa-typing-bub span:nth-child(2){animation-delay:.2s;}
.wa-typing-bub span:nth-child(3){animation-delay:.4s;}
@keyframes waDot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* Chips */
.wa-chips{display:flex;flex-wrap:wrap;gap:7px;padding:5px 0 4px;animation:waIn .2s ease forwards;}
.wa-chip{background:transparent;border:1.5px solid var(--gold-muted);color:var(--gold);font-family:'DM Sans',sans-serif;font-size:13px;padding:6px 15px;border-radius:20px;cursor:pointer;transition:background .18s,color .18s,border-color .18s;white-space:nowrap;}
.wa-chip:hover,.wa-chip:active{background:var(--gold);color:#0b141a;border-color:var(--gold);}

/* Input */
.wa-input-bar{background:var(--wa-header);padding:8px 12px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;border-top:1px solid var(--wa-divider);}
.wa-text-wrap{flex:1;background:var(--wa-input-bg);border-radius:24px;padding:10px 18px;display:flex;align-items:center;}
.wa-text-wrap textarea{width:100%;background:transparent;border:none;outline:none;color:var(--wa-text);font-family:'DM Sans',sans-serif;font-size:15px;resize:none;max-height:120px;min-height:22px;line-height:1.4;display:block;}
.wa-text-wrap textarea::placeholder{color:var(--wa-muted);}
.wa-send{width:48px;height:48px;border-radius:50%;background:var(--gold);color:#0b141a;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .18s,transform .1s;}
.wa-send:disabled{background:#2a3942;color:var(--wa-muted);cursor:not-allowed;}
.wa-send:not(:disabled):hover{opacity:.88;}
.wa-send:not(:disabled):active{transform:scale(.95);}

@media(max-width:480px){.wa-bub{max-width:86%;}.wa-chat{padding:8px 10px 6px;}}
</style>
</head>
<body>

<!-- ACCESS GATE -->
<div id="gate">
  <div class="gate-logo">PeakFuelling</div>
  <div class="gate-sub">Full 90 Formula</div>
  <div class="gate-title">Client Access</div>
  <p class="gate-desc">Enter your monthly access code to open your meal planner.</p>
  <input class="gate-input" type="text" id="codeInput" placeholder="Enter access code" autocomplete="off" autocorrect="off" spellcheck="false">
  <button class="gate-btn" onclick="checkCode()">Enter</button>
  <div class="gate-error" id="gateError"></div>
  <p class="gate-note">Access code updated monthly. Check your WhatsApp from Liam.</p>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">
  <div class="wa-header">
    <div class="wa-avatar">LC</div>
    <div class="wa-info">
      <div class="wa-name">Liam Carroll Nutrition</div>
      <div class="wa-badge">Full 90 Formula</div>
      <div class="wa-status"><div class="wa-online-dot"></div>Your match week planner</div>
    </div>
  </div>
  <div class="wa-chat" id="chat">
    <div class="wa-date-div"><span>Today</span></div>
  </div>
  <div class="wa-input-bar">
    <div class="wa-text-wrap">
      <textarea id="input" placeholder="Message" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="wa-send" id="sendBtn" onclick="sendFromInput()" disabled aria-label="Send">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
const ACCESS_CODE = "FULL90-AUG26";

const SYSTEM_PROMPT = `You are Liam Carroll, football nutritionist, Masters in Sports Nutrition, running PeakFuelling Full 90 Formula. You are chatting with a paying client via a private WhatsApp-style planner.

Personality: knowledgeable mate. Casual, fun, a laugh. When delivering nutrition guidance, switch to confident, direct, credible. Short messages like real WhatsApp. Never use em dashes.

RULE: Ask ONE question at a time. Extract everything already known from their message. Never ask what you can work out. Never repeat a question.

MATCH DAY RULE: If today is match day, never ask about training. Go from kick-off straight to weight.

COLLECT only what is missing, one at a time:
1. Single or double game week
2. Today's day
3. Game day and kick-off time together
4. Training today, time, duration (non-match days only)
5. Weight in kg
6. Position (GK, DEF, MID, FWD, Winger)
7. Cooking ability (beginner, intermediate, advanced)
8. Time to cook and cooking for how many together
9. Protein powder at home
10. Full plan with shopping list OR use what is in the fridge

Build plan immediately after. No more questions.

INFER: match day or game today = skip date and game day. Night before = MD-1, skip date. Game Saturday = skip game day. Training mentioned = skip training question.

MD DAY: MD-4+ moderate CHO. MD-3 moderate-high. MD-2 reduce fibre. MD-1 high CHO white carbs low fat low fibre. MD = 4-2-1-0. MD+1 recovery default starter. Double game week = upper end CHO throughout.

CALORIES per kg: rest x30-32, light training x33-36, hard x37-40, MD-1 x40-42, match day x42-45, MD+1 starter x36-40. GK lower, DEF lower-mid, MID upper, FWD/Wing mid-upper.

PROTEIN: 2.0g/kg daily always.

CHO per meal (Anderson et al 2022): MD-4+ light: B0.5-1.0 L1.0 S0.5-1.0 D1.0. MD-4 75-80min: B1.0 L1.5-2.0 S0.5-1.0 D0.5-1.0. MD-3: B1.0 L1.5-2.0 S0.5-1.0 D0.5-1.0. MD-2: B0.5 L1.5-2.0 S0.5-1.0 D0.5-1.0. MD-1: B2.0 during60g/hr L2.0 S1.5 D2.0. MD+1 starter: same as MD-1. MD+1 non-starter: B0.5-1.0 L1.5-2.0 S0.5-1.0 D0.5-1.0. FAT: fill remaining, minimise MD-1 and match day. High CHO days pair solid food with large OJ or apple juice always.

DURING TRAINING: 18+ = sports drink and banana or gel. Under 18 = Lucozade Sport and banana or dates, no gels no caffeine no supplements.

4-2-1-0 MATCH DAY work back from kick-off: 4hrs = largest meal 2.0g/kg CHO lean protein low fat low fibre. 2hrs = toast and honey, banana, juice. 1hr = banana, dates, rice cakes and honey, small juice. During 18+ = gels 30-60g/hr sports drink. Under 18 = Lucozade Sport banana at HT water. Post-match 30-60min = 1.2g/kg CHO x3hrs protein across meals fat fine.

PROTEIN SOURCES: MD-1 and match day pre-match = lean only, chicken breast, turkey, white fish, no salmon no red meat no eggs as main no full fat dairy. All other days and post-match = salmon, steak, mince, eggs, full fat dairy fine. Protein powder = breakfast smoothies and post-match evening only.

BREAKFAST only at breakfast, never dinner food: porridge and banana and honey, eggs on toast, yoghurt and granola and fruit, overnight oats, smoothie with oats and banana and milk (add powder if available), pancakes and honey (MD-1 and match day only), toast and PB and banana, Weetabix or Shreddies with milk and fruit. High CHO always pair with large OJ or apple juice.

LUNCH: chicken and rice bowl, pasta and tomato and mince, jacket potato and tuna, chicken wrap (avoid MD-1), microwave rice and tinned tuna (quick option).

DINNER: salmon and sweet potato and green beans (avoid MD-1), chicken stir fry and noodles (avoid MD-1), beef and rice and peppers, pasta and chicken and pesto, turkey bolognese and pasta, cod and new potatoes and broccoli (reduce broccoli MD-1), chicken and rice and tinned tomatoes.

SNACKS only if targets need: rice cakes and PB, banana and almonds, yoghurt and honey, oatcakes and cottage cheese, dates (MD-1 and match day), white bread and honey or jam (MD-1 and match day), OJ or apple juice CHO top-up.

MD-1 and match day: white over wholegrain always. No high fibre veg. No heavy fatty meals. No new foods. Liquid carbs to hit targets not volume.

COOKING: beginner = one pan under 15 mins simple. Intermediate = from scratch under 30 mins. Advanced = multi-component under 45 mins. Under 15 mins available = quick assembly fine. Default = proper cooked meal. Full step by step instructions always. Real food, achievable, nothing pretentious. If they dislike something swap it without fuss.

SHOPPING LIST: whole foods, budget-friendly, normal supermarket. Group: Protein, Carbs, Fruit and Veg, Dairy, Store Cupboard. Scale for number of people.

FRIDGE ROUTE: build only from listed ingredients. If short on carbs MD-1 or match day say once: Worth grabbing some white rice, pasta, bread or OJ if you can.

UNDER 18s: no supplements, no powder, no gels, no caffeine. Whole food swaps only.

End every plan: If you have any allergies or intolerances let me know and I will adjust.

Then: Built by PeakFuelling. Your GPS integration, Matchday Report and direct WhatsApp access is what the full programme is for.`;

function checkCode(){
  const val=document.getElementById("codeInput").value.trim().toUpperCase();
  const err=document.getElementById("gateError");
  if(val===ACCESS_CODE.toUpperCase()){
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="flex";
    setTimeout(()=>addMsg("assistant","Hey! How can I help?"),700);
  }else{
    document.getElementById("codeInput").classList.add("err");
    err.textContent="Incorrect code. Check your WhatsApp from Liam.";
    setTimeout(()=>document.getElementById("codeInput").classList.remove("err"),400);
  }
}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.getElementById("gate").style.display!=="none")checkCode();});

function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}

let msgs=[],loading=false;

const CHIPS=[
  {m:t=>t.includes("single")&&t.includes("double"),c:["Single game week","Double game week"]},
  {m:t=>t.includes("do you have training today"),c:["Yes, training today","No training today"]},
  {m:t=>t.includes("goalkeeper")&&t.includes("defender"),c:["Goalkeeper","Defender","Midfielder","Forward / Winger"]},
  {m:t=>t.includes("beginner")&&t.includes("intermediate"),c:["Beginner","Intermediate","Advanced"]},
  {m:t=>t.includes("how much time")&&t.includes("cook"),c:["Under 15 mins","20-30 mins","40+ mins","No rush"]},
  {m:t=>t.includes("protein powder"),c:["Yes, I have protein powder","No protein powder"]},
  {m:t=>t.includes("shopping list")&&t.includes("fridge"),c:["Full plan and shopping list","Use what's in my fridge"]},
  {m:t=>t.includes("how long")&&t.includes("roughly"),c:["About 60 mins","About 75 mins","About 90 mins","Not sure"]},
  {m:t=>t.includes("over 18"),c:["Yes, over 18","Under 18"]},
];
function getChips(t){const tl=t.toLowerCase();for(const r of CHIPS){if(r.m(tl))return r.c;}return[];}

function formatBubble(text){
  const mark="Built by PeakFuelling.";let main=text,tag=null;
  const fi=text.indexOf(mark);if(fi!==-1){main=text.slice(0,fi).trim();tag=text.slice(fi).trim();}
  let html="";const lines=main.split("\n");let i=0;
  while(i<lines.length){
    const l=lines[i].trim();if(!l){i++;continue;}
    if((l.startsWith("**")&&l.endsWith("**")&&l.length>4)||l.startsWith("## ")||l.startsWith("### ")){
      html+=`<div class="mh">${esc(l.replace(/^#+\s*/,"").replace(/^\*\*|\*\*$/g,""))}</div>`;
    }else if(l.startsWith("- ")||l.startsWith("* ")){
      html+="<ul>";
      while(i<lines.length&&(lines[i].trim().startsWith("- ")||lines[i].trim().startsWith("* "))){html+=`<li>${inl(lines[i].trim().slice(2))}</li>`;i++;}
      html+="</ul>";continue;
    }else if(/^\d+\.\s/.test(l)){
      html+="<ol>";
      while(i<lines.length&&/^\d+\.\s/.test(lines[i].trim())){html+=`<li>${inl(lines[i].trim().replace(/^\d+\.\s/,""))}</li>`;i++;}
      html+="</ol>";continue;
    }else{html+=`<p>${inl(l)}</p>`;}
    i++;
  }
  if(tag)html+=`<div class="pf-tag">${esc(tag)}</div>`;
  return html;
}
function inl(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function scrollBottom(){const c=document.getElementById("chat");c.scrollTop=c.scrollHeight;}

function addMsg(role,content){
  const ex=document.getElementById("chipRow");if(ex)ex.remove();
  const row=document.createElement("div");row.className=`wa-row ${role==="user"?"out":"in"}`;
  const bub=document.createElement("div");bub.className="wa-bub";
  if(role==="user"){bub.textContent=content;}else{bub.innerHTML=formatBubble(content);}
  const meta=document.createElement("div");meta.className="wa-meta";
  const t=document.createElement("span");t.className="wa-time";t.textContent=nowTime();
  meta.appendChild(t);
  if(role==="user"){const tick=document.createElement("span");tick.className="wa-tick";tick.innerHTML="&#10003;&#10003;";meta.appendChild(tick);}
  const wrap=document.createElement("div");wrap.style.cssText="display:flex;flex-direction:column;max-width:72%;";
  wrap.appendChild(bub);wrap.appendChild(meta);
  row.appendChild(wrap);
  document.getElementById("chat").appendChild(row);
  if(role==="assistant"){
    const chips=getChips(content);
    if(chips.length){
      const cr=document.createElement("div");cr.className="wa-chips";cr.id="chipRow";
      chips.forEach(c=>{const b=document.createElement("button");b.className="wa-chip";b.textContent=c;b.onclick=()=>send(c);cr.appendChild(b);});
      document.getElementById("chat").appendChild(cr);
    }
  }
  scrollBottom();
}

function showTyping(){
  const row=document.createElement("div");row.className="wa-typing-row";row.id="typing";
  row.innerHTML=`<div class="wa-typing-bub"><span></span><span></span><span></span></div>`;
  document.getElementById("chat").appendChild(row);scrollBottom();
}
function hideTyping(){const t=document.getElementById("typing");if(t)t.remove();}

async function send(text){
  text=text.trim();if(!text||loading)return;
  msgs.push({role:"user",content:text});addMsg("user",text);
  const inp=document.getElementById("input");inp.value="";inp.style.height="22px";
  document.getElementById("sendBtn").disabled=true;loading=true;showTyping();
  try{
    const r=await fetch("/.netlify/functions/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:SYSTEM_PROMPT,messages:msgs})});
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    const reply=d.content?.[0]?.text||"Something went wrong. Try again.";
    msgs.push({role:"assistant",content:reply});hideTyping();addMsg("assistant",reply);
  }catch(e){
    hideTyping();const err="Error: "+(e.message||"Connection issue.");
    msgs.push({role:"assistant",content:err});addMsg("assistant",err);
  }
  loading=false;
  document.getElementById("sendBtn").disabled=!document.getElementById("input").value.trim();
}

function sendFromInput(){send(document.getElementById("input").value);}
function handleKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendFromInput();}}
function autoResize(el){el.style.height="22px";el.style.height=Math.min(el.scrollHeight,120)+"px";document.getElementById("sendBtn").disabled=!el.value.trim();}
</script>
</body>
</html>
